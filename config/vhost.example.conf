# Ejemplo para instalación convencional. NO aplicar sin autorización.
# Respaldar httpd.conf, httpd-vhosts.conf, httpd-xampp.conf y php.ini primero.
# Sustituir RUTA_PROYECTO y verificar el runtime seguro antes de iniciar.
# Conservar el VirtualHost existente de localhost si es el predeterminado.
<VirtualHost *:80>
    ServerName admosa.local
    DocumentRoot "RUTA_PROYECTO/public"
    <Directory "RUTA_PROYECTO/public">
        Options -Indexes -MultiViews
        AllowOverride None
        Require local
        DirectoryIndex index.php
        FallbackResource /index.php
        LimitRequestBody 12582912
    </Directory>
</VirtualHost>

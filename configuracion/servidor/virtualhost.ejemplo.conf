# Archivo: configuracion/servidor/virtualhost.ejemplo.conf
# Propósito: Muestra una configuración Apache para instalación convencional.
# Funcionamiento: Publica únicamente publico/, restringe el acceso a conexiones locales y envía las rutas de la aplicación a index.php.

# Plantilla de instalación convencional. Respaldar configuración y pedir autorización antes de aplicar.
# Define el sitio; reemplazar RUTA_PROYECTO antes de utilizar esta plantilla.
<VirtualHost *:80>
    ServerName documentos.local
    DocumentRoot "RUTA_PROYECTO/publico"
# Reglas públicas: acceso local, entrada index.php y límite del cuerpo HTTP.
    <Directory "RUTA_PROYECTO/publico">
        Options -Indexes -MultiViews
        AllowOverride None
        Require local
        DirectoryIndex index.php
        FallbackResource /index.php
        LimitRequestBody 12582912
    </Directory>
</VirtualHost>

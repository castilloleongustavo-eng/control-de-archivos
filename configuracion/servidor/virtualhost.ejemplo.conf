# Plantilla de instalación convencional. Respaldar configuración y pedir autorización antes de aplicar.
<VirtualHost *:80>
    ServerName documentos.local
    DocumentRoot "RUTA_PROYECTO/publico"
    <Directory "RUTA_PROYECTO/publico">
        Options -Indexes -MultiViews
        AllowOverride None
        Require local
        DirectoryIndex index.php
        FallbackResource /index.php
        LimitRequestBody 12582912
    </Directory>
</VirtualHost>
